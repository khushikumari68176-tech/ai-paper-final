 <script>

// 👉 Load data
// /let data = JSON.parse(localStorage.getItem("paperData"));
let data = JSON.parse(sessionStorage.getItem("paperData"));
let count = 1; // 🔥 GLOBAL QUESTION NUMBER

/* ===== HTML DESIGN (UNIVERSITY STYLE) ===== */

let html = `
<div class="header">
<h2>Pratice University Type Question Paper</h2>
<h3>B.Tech Examination 2026-27</h3>
<h3>Information Technology</h3>
<p><b>Subject:</b> ${data.subject}</p>
<p style="border-bottom:solid black 4px;">[Time: 3 Hours] &nbsp;&nbsp;&nbsp;&nbsp; [Maximum Marks: 75]</p>
</div>

<p><b>Note:</b> There are <b>three</b> sections <b>(A, B and C)</b> and candidate has to attempt questions from all sections.</p>

<div class="section">
<div class="section-title">SECTION - A (5 × 3 = 15)</div>
<p><b>Note:</b> Attempt any five questions.</p>

${data.sectionA.map(q=>{
let temp = `<p class="q"><b>Q${count}.</b> ${q}</p>`;
count++;
return temp;
}).join("")}

</div>

<div class="section">
<div class="section-title">SECTION - B (4 × 5 = 20)</div>
<p><b>Note:</b> Attempt any four questions.</p>

${data.sectionB.map(q=>{
let temp = `<p class="q"><b>Q${count}.</b> ${q}</p>`;
count++;
return temp;
}).join("")}

</div>

 <div class="section">
 <div class="section-title">SECTION - C (2 × 20 = 40)</div>
 <p><b>Note:</b> Attempt any two questions.</p>

 ${data.sectionC.map(q=>{   // 🔥 FIX: sectionC use
let temp = `<p class="q"><b>Q${count}.</b> ${q}</p>`;
count++;
return temp;
}).join("")}

</div>

<div style="margin-top:40px;">
<p><b>Note:</b> Attempt all questions.</p>
</div>
`;

document.getElementById("paper").innerHTML = html;
 


/* ===== PDF ===== */

function downloadPDF(){

html2canvas(document.getElementById("paper")).then(canvas => {

const imgData = canvas.toDataURL("image/png");

const { jsPDF } = window.jspdf;
const pdf = new jsPDF('p','mm','a4');

let imgWidth = 210;
let pageHeight = 295;

let imgHeight = canvas.height * imgWidth / canvas.width;
let heightLeft = imgHeight;

let position = 0;

pdf.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
heightLeft -= pageHeight;

/* AUTO MULTIPLE PAGE */
while(heightLeft > 0){
position = heightLeft - imgHeight;
pdf.addPage();
pdf.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
heightLeft -= pageHeight;
}

pdf.save("University_Paper.pdf");

});
}

</script>
</body>
