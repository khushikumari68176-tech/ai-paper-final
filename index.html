<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login-</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        /* background: linear-gradient(135deg, #0f2027, #122227, #43575f); */
        background: linear-gradient(135deg,#435668,#6f257e);
        font-family: Arial, sans-serif;
      }
      .container {
        width: 90%;
        max-width: 380px;
        background-color: #fff;
        padding: 25px;
        border-radius: 14px;
        box-shadow: 4px 8px 10px rgba(0, 0, 0, 0.63);
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 12px 0;
        border-radius: 8px;
        border: 1px solid #7a7979;
        font-size: 14px;
      }
      button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        /* background: linear-gradient(135deg, #27363d, #47717e, #43575f); */
         background: linear-gradient(135deg,#4b99e2,#dc5af7);
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background: linear-gradient(135deg, #1b3b49, #4c8292, #30697e);
      }
      .sign{
        padding: 10px;
      }
      #error{
        color: red;
      }
      @media (max-width: 650px) {
        .container {
          padding: 20px;
        }
      }
      .password-box{
        position: relative;
      }
      .password-box input{
        padding-right: 10px;
      }
       #eye{
        position: absolute;
        right:12px;
        top:50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>AI Question Paper Generator</h2>
      <input type="text" id="username" placeholder="username" />
      <div class="password-box">
              <input type="password" id="password" placeholder="enter your password" />
<i class="fa-solid fa-eye" id="eye" onclick="toggle()"></i>

      </div>
      <!-- <input type="password" id="password" placeholder="enter your password" /> -->
      <button onclick="login()">Login</button>
      <p id="error"></p>
      <p class="sign">Don't have account? <a href="signup.html" >Sign Up</a> </p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
