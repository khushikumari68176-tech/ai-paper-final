 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>AI Question Paper Generator</title>
<!-- <link rel="stylesheet" href="style.css"> -->
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        height: 100vh;
        background: linear-gradient(135deg,#020202,#c00aa2);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .main{
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap:10px;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 4px 10px 12px rgb(39, 39, 39);
    }
    .main:hover{
        box-shadow: 4px 6px 8px black;
    }
    .dashboard{
        display: flex;
        flex-direction: column;
        width: 70%;
        gap:10px;
        
    }
    button{
        font-size: 18px;
        padding: 10px;
        border: none;
        background: linear-gradient(135deg,rgb(116, 73, 116),rgb(36, 36, 56));
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }
    button:hover{
          background: linear-gradient(135deg,rgb(173, 93, 173),rgb(97, 97, 197));
          transform: scale(1.03);
    }
     @media (max-width: 650px) {
        .main{
          padding: 20px;
          width: 100%;
        }
      }
</style>
</head>


<body>
<div class="main"> 
<h1>AI Question Paper Generator</h1>

<div class="dashboard">


<button onclick="selectSubject('math')">Math</button>
<button onclick="selectSubject('english')">English</button>
<button onclick="selectSubject('os')">Operating System</button>
<button onclick="selectSubject('ds')">Data Structure</button>
<button onclick="selectSubject('python')">Python</button>
<button onclick="selectSubject('js')">Javascript</button>
<button onclick="selectSubject('ai')">AI/ML</button>
<button onclick="selectSubject('de')">Digital Electronics</button>
<button onclick="selectSubject('science')">Science</button>

</div>
</div>
<script >

function selectSubject(subject){
localStorage.setItem("subject",subject)
window.location.href="question.html"
}

</script>

</body>
</html>
