 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Paper</title>
  <style>
    *{
        margin:0;
        padding: 0;
        box-sizing: border-box;
    }
   body{
    min-height: 100vh;
    background: linear-gradient(135deg,#2b365a,#a90c8f);
    display: flex;
    justify-content: center;
    align-items: center;
   
   }
   .main{
    width:100%;
    max-width: 420px;
    background:#fff;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0px 10px 25px rgba(0, 0, 0,0.3);
    backdrop-filter: blur(10px);
   }
   .difficulty{
    display: flex;
   
    flex-direction: column;
    gap:12px;
    margin-top: 15px;

   }
button{
    width: 100%;
    padding: 12px;
    border: none;
    background: linear-gradient(135deg,#527596,#351b3a);
    border-radius: 8px;
    color: white;
    cursor: pointer;
    transition: 0.13s;
    font-size: 16px;
}
button:hover{
    transform: scale(1.03);
}
.actions{
    display: flex;
    
    flex-direction: column;
    gap:10px;
    padding-top: 15px;
}
 @media(max-width:600px){
        body{
         align-items: flex-start;
         padding-top: 40px;
          
        }
        .main{
            max-width: 100%;
            padding: 18px;
        }
        .h1{
            font-size: 18px;
            

        }
        button{
            font-size: 15px;
            padding: 11px;
        }
      }
      /* tablet */
      @media(min-width:601px)and(max-width:900px){
        .main{
            max-width: 500px;
        }
      }
 </style>
</head>

<body>
<div class="main"> 
<h1 id="title" style="text-align: center;">Standard Of Paper</h1>

<div class="difficulty">

 
 <button onclick="openPaper('easy')">Easy</button>
<button onclick="openPaper('medium')">Medium</button>
<button onclick="openPaper('hard')">Hard</button>

</div>

<div id="questions"></div>

<div class="actions">

<button onclick="generatePaper()">Generate Paper</button>
<button onclick="window.location.href='index.html'">Back Paper Dashboard</button>
 <button> <a href="../project/dashboard.html" style="text-decoration: none;color: white;">⬅ Back Dashboard</a></button>


</div>
</div>
 <script src="script.js">


</script>
  
</body>
</html>
